[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingo-agent"
version = "0.1.0"
description = "Reference pronunciation-coach voice agent on AssemblyAI's Voice Agent API, with guardrails and evals"
requires-python = ">=3.11"
dependencies = [
    "websockets>=14.0,<18",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6,<1"]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
lingo-agent = "lingua_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/lingua_agent", "evals"]
omit = ["src/lingua_agent/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "E701", "E702", "ASYNC240"]  # ASYNC240: small local file reads in CLI tools

[tool.ruff.lint.isort]
known-first-party = ["lingua_agent", "evals", "conftest"]
